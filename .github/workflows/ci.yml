name: CI

on:
  push:
    branches: [main, 'refactor/**', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, 'refactor/**']

# Cancel superseded runs on the same branch — saves CI minutes when
# you push multiple commits in quick succession.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  customer:
    name: Customer app (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Unit tests import functions/index.js, whose deps live under
      # functions/package.json — install them so the suite can resolve
      # 'firebase-functions/v2/firestore' etc. (not a prod runtime dep of the
      # customer bundle).
      - name: Install Function deps
        run: npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Worker syntax check
        # Parse email-worker.js with Node to catch fatal syntax errors
        # before wrangler deploy runs against production. Lint catches
        # most of this but a separate parse pass guards against ESLint
        # rule gaps and shows up as its own failing step in the CI UI.
        run: node --check email-worker.js

      # Build BEFORE the unit tests: the suite needs the placeholder .env (the
      # App Check guard test) and dist/ (the sw-precache test).
      # IPEAR_ALLOW_PLACEHOLDER_ENV=1 lets validate-env.js accept placeholder
      # Firebase config here; the deploy:pages flow never sets it, so a real
      # `.env` → deploy slip still hard-fails the build.
      - name: Build (placeholder env → DEMO mode)
        env:
          IPEAR_ALLOW_PLACEHOLDER_ENV: '1'
        run: |
          cp .env.example .env
          printf '\nVITE_APP_CHECK_DISABLED=0\n' >> .env
          npm run build

      - name: Unit tests
        run: npm test

  # Customer production dependency audit — kept as its own STRICT, independent
  # job (separated from the functional `customer` gate above). It is EXPECTED
  # to be RED while the upstream chain firebase@10 → @firebase/firestore →
  # @grpc/grpc-js ~1.9.0 has no patched release (no override/major upgrade is
  # justified for the WIF migration). The gate is deliberately unweakened: no
  # continue-on-error, no `|| true`, no severity reduction, no ignore list.
  customer_audit:
    name: Customer dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit (production deps only)
        run: npm audit --omit=dev --audit-level=high

  # Firestore Security Rules — emulator-backed regression tests. Runs in
  # parallel to the customer + functions jobs. The emulator is JVM-based
  # so we need a Java runtime; setup-java pins openjdk-17 for determinism
  # (the firebase emulator dropped Java 11 support in 2024).
  rules:
    name: Firestore Rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm ci

      - name: Cache Firebase emulator binaries
        # firebase emulators:exec downloads the firestore JAR (~70 MB) on
        # first run; caching ~/.cache/firebase saves ~20s per CI run.
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-firestore-v1

      - name: Run rules tests
        run: npm run test:rules

  functions:
    name: Cloud Functions (install + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm ci

      - name: Smoke import
        run: node -e "require('firebase-admin'); require('firebase-functions');"

      - name: Audit
        run: npm audit --audit-level=high

  # E2E (Playwright). Runs ONLY after lint + unit tests pass — there is no
  # point spinning up a chromium browser if the bundle won't even build.
  # Skipped on forks (PRs from outside collaborators) because we can't expose
  # the test secrets to untrusted code; for those we rely on the customer +
  # functions jobs as the safety net.
  #
  # Specs that run here (any tests/e2e/**.spec.js gets picked up by playwright):
  #   • golden-path.spec.js     — customer login → reward redeem → ledger row
  #   • kiosk-survival.spec.js  — cashier session survives the 4.7s validator
  #                               window on /tablet AND /admin (regression
  #                               coverage for the 2026-06-23 outage)
  e2e:
    name: E2E (Playwright)
    needs: customer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Keyless GCP auth via Workload Identity Federation (no JSON key). The
    # protected `ci-e2e` environment emits the OIDC `environment` claim that the
    # WIF provider condition requires (repo + environment); only THIS job gets
    # id-token:write + the environment, so customer/rules/functions stay
    # credential-free.
    environment: ci-e2e
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Authenticate to Google Cloud without a long-lived key. Pinned to the
      # exact immutable commit SHA of google-github-actions/auth v2.1.13.
      - name: Authenticate to Google Cloud (keyless WIF)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: loyalty-ipear
          workload_identity_provider: projects/927652567960/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ipear-loyalty-ci@loyalty-ipear.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Write real .env from secrets
        # The `customer` job builds in DEMO mode (cp .env.example .env). E2E
        # needs the bundle pointed at REAL Firebase to actually log in and
        # see live snapshots. Build is rerun in the next step against this
        # production-shaped .env.
        # VITE_APP_CHECK_KEY is optional — only needed if the project has
        # App Check enforcement on. If unset, the build silently skips
        # App Check init (see firebase-init.js).
        run: |
          cat <<'EOF' > .env
          VITE_FB_API_KEY=${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN=${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID=${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_FB_STORAGE_BUCKET=${{ secrets.VITE_FB_STORAGE_BUCKET }}
          VITE_FB_MSG_SENDER_ID=${{ secrets.VITE_FB_MSG_SENDER_ID }}
          VITE_FB_APP_ID=${{ secrets.VITE_FB_APP_ID }}
          VITE_WORKER_URL=${{ secrets.VITE_WORKER_URL }}
          VITE_APP_CHECK_KEY=${{ secrets.VITE_APP_CHECK_KEY }}
          EOF

      - name: Seed E2E test customer + reward
        # Resets the e2e@ipear.gr customer doc to a known-good baseline
        # (points=1500, balance/totalPoints in sync) so the golden-path
        # debit-1000 → expect 500 assertion is stable across CI runs that
        # share live Firestore state. Without this, a previous failed run
        # leaves the customer at e.g. 299 points and every subsequent run
        # hits "insufficient points". Also upserts the dummy reward the
        # spec exercises. Idempotent.
        env:
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          # Credentials now come from WIF ADC (the auth step above) — no JSON key.
        run: npm run e2e:seed

      - name: Install Playwright browsers (chromium only)
        # --with-deps installs the OS-level packages chromium needs on Ubuntu.
        # Cache hit is automatic via setup-node's npm cache for the browsers
        # symlink; the actual chromium tarball is small enough to not warrant
        # a separate cache step.
        run: npx playwright install --with-deps chromium

      - name: Run E2E specs
        env:
          # Golden-path customer flow
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASS: ${{ secrets.E2E_TEST_PASS }}
          # Credentials now come from WIF ADC (the auth step above) — no JSON key.
          # Kiosk-survival admin/tablet flow — separate account from the
          # customer above. MUST be admin via custom claim, ipear_admins doc,
          # OR email allow-list rescue (see firestore.rules → isAdmin()).
          # Add via: gh secret set TEST_ADMIN_EMAIL --body "tablet@ipear.gr"
          #          gh secret set TEST_ADMIN_PASS  --body "<password>"
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASS }}
          # Optional. If the Firebase project has App Check enforcement on,
          # register a debug token (Firebase Console → App Check → Manage
          # debug tokens) and store it as this secret. The spec injects it
          # via page.addInitScript() before the app loads. If unset, the
          # spec runs without it and assumes App Check is fail-open / off.
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN }}
          CI: 'true'
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
