name: CI

on:
  push:
    branches: [main, 'refactor/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — saves CI minutes when
# you push multiple commits in quick succession.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  customer:
    name: Customer app (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Worker syntax check
        # Parse email-worker.js with Node to catch fatal syntax errors
        # before wrangler deploy runs against production. Lint catches
        # most of this but a separate parse pass guards against ESLint
        # rule gaps and shows up as its own failing step in the CI UI.
        run: node --check email-worker.js

      - name: Unit tests
        run: npm test

      - name: Build (uses placeholder env → DEMO mode)
        # IPEAR_ALLOW_PLACEHOLDER_ENV=1 tells scripts/validate-env.js (the
        # `prebuild` hook) that placeholder Firebase config is acceptable
        # here — this job's only purpose is to confirm the bundle compiles,
        # not that it'd run in prod. The deploy:pages flow never sets this
        # var, so a real `cp .env.example .env` → deploy slip is now a
        # hard build-time failure (not a runtime DEMO regression).
        env:
          IPEAR_ALLOW_PLACEHOLDER_ENV: '1'
        run: |
          cp .env.example .env
          npm run build

      - name: Audit (production deps only)
        run: npm audit --omit=dev --audit-level=high

  # Firestore Security Rules — emulator-backed regression tests. Runs in
  # parallel to the customer + functions jobs. The emulator is JVM-based
  # so we need a Java runtime; setup-java pins openjdk-17 for determinism
  # (the firebase emulator dropped Java 11 support in 2024).
  rules:
    name: Firestore Rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm ci

      - name: Cache Firebase emulator binaries
        # firebase emulators:exec downloads the firestore JAR (~70 MB) on
        # first run; caching ~/.cache/firebase saves ~20s per CI run.
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-firestore-v1

      - name: Run rules tests
        run: npm run test:rules

  functions:
    name: Cloud Functions (install + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm ci

      - name: Smoke import
        run: node -e "require('firebase-admin'); require('firebase-functions');"

      - name: Audit
        run: npm audit --audit-level=high

  # Golden-path E2E (Playwright). Runs ONLY after lint + unit tests pass —
  # there is no point spinning up a chromium browser if the bundle won't even
  # build. Skipped on forks (PRs from outside collaborators) because we can't
  # expose the test secrets to untrusted code; for those we rely on the
  # customer + functions jobs as the safety net.
  e2e:
    name: E2E (Golden Path)
    needs: customer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Write real .env from secrets
        # The `customer` job builds in DEMO mode (cp .env.example .env). E2E
        # needs the bundle pointed at REAL Firebase to actually log in and
        # see live snapshots. Build is rerun in the next step against this
        # production-shaped .env.
        # VITE_APP_CHECK_KEY is optional — only needed if the project has
        # App Check enforcement on. If unset, the build silently skips
        # App Check init (see firebase-init.js).
        run: |
          cat <<'EOF' > .env
          VITE_FB_API_KEY=${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN=${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID=${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_FB_STORAGE_BUCKET=${{ secrets.VITE_FB_STORAGE_BUCKET }}
          VITE_FB_MSG_SENDER_ID=${{ secrets.VITE_FB_MSG_SENDER_ID }}
          VITE_FB_APP_ID=${{ secrets.VITE_FB_APP_ID }}
          VITE_WORKER_URL=${{ secrets.VITE_WORKER_URL }}
          VITE_APP_CHECK_KEY=${{ secrets.VITE_APP_CHECK_KEY }}
          EOF

      - name: Install Playwright browsers (chromium only)
        # --with-deps installs the OS-level packages chromium needs on Ubuntu.
        # Cache hit is automatic via setup-node's npm cache for the browsers
        # symlink; the actual chromium tarball is small enough to not warrant
        # a separate cache step.
        run: npx playwright install --with-deps chromium

      - name: Run Golden Path
        env:
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASS: ${{ secrets.E2E_TEST_PASS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # Optional. If the Firebase project has App Check enforcement on,
          # register a debug token (Firebase Console → App Check → Manage
          # debug tokens) and store it as this secret. The spec injects it
          # via page.addInitScript() before the app loads. If unset, the
          # spec runs without it and assumes App Check is fail-open / off.
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN }}
          CI: 'true'
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
